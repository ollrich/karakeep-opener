# CI für Karakeep Opener: Tests und web-ext lint bei jedem Push und PR auf main.
# Signiert wird über addons.mozilla.org (siehe BACKLOG.md), nicht hier.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
